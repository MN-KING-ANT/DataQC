<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Survey Rawdata Logic Validator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style> body { font-family: 'Pretendard', -apple-system, sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <span class="bg-blue-600 text-white px-2.5 py-1 rounded-md text-sm font-extrabold">QC</span>
          설문 Rawdata 로직 검증기
        </h1>
        <p class="text-xs text-slate-500 mt-0.5">Multi-Open 동시 지원(텍스트 허용) 및 Exclusive(없음) 자동 배타성 검증 완비</p>
      </div>
      <div class="flex items-center gap-3">
        <button id="btnDownloadReport" onclick="exportErrorReport()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm transition">오류 리포트 다운로드 (.xlsx)</button>
        <button onclick="location.reload()" class="text-sm text-slate-600 border border-slate-300 px-3 py-2 rounded-lg bg-white hover:bg-slate-50 transition">초기화</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-6 space-y-6">
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-500 transition cursor-pointer relative">
        <input type="file" id="logicFileInput" accept=".xlsx,.xls,.csv" class="absolute inset-0 opacity-0 cursor-pointer" />
        <div class="space-y-2">
          <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto font-bold text-lg">1</div>
          <h2 class="text-base font-bold text-slate-800">로직 가이드 파일 업로드</h2>
          <p id="logicFileName" class="text-sm font-semibold text-blue-600 pt-1">파일을 선택하거나 드래그하세요</p>
        </div>
      </div>
      <div class="bg-white border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:border-blue-500 transition cursor-pointer relative">
        <input type="file" id="rawFileInput" accept=".xlsx,.xls,.csv" class="absolute inset-0 opacity-0 cursor-pointer" />
        <div class="space-y-2">
          <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto font-bold text-lg">2</div>
          <h2 class="text-base font-bold text-slate-800">Rawdata 파일 업로드</h2>
          <p id="rawFileName" class="text-sm font-semibold text-indigo-600 pt-1">파일을 선택하거나 드래그하세요</p>
        </div>
      </div>
    </section>

    <section class="bg-white border border-slate-200 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-4 flex-wrap">
        <div class="flex items-center gap-2">
          <label class="text-xs font-semibold text-slate-600">응답자 ID:</label>
          <select id="idColSelect" class="text-sm border border-slate-300 rounded-lg px-3 py-1.5 bg-slate-50"><option value="__ROW__">엑셀 행 번호</option></select>
        </div>
      </div>
      <button id="btnRunValidation" onclick="runValidation()" disabled class="bg-blue-600 disabled:bg-slate-300 hover:bg-blue-700 text-white font-semibold text-sm px-6 py-2.5 rounded-lg shadow-sm transition">검증 실행</button>
    </section>

    <section id="kpiSection" class="hidden grid grid-cols-2 md:grid-cols-5 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200"><p class="text-xs text-slate-500">총 응답자</p><p id="kpiTotalResp" class="text-2xl font-bold mt-1">0</p></div>
      <div class="bg-white p-4 rounded-xl border border-slate-200"><p class="text-xs text-slate-500">검증 단위 수</p><p id="kpiTotalVars" class="text-2xl font-bold mt-1">0</p></div>
      <div class="bg-white p-4 rounded-xl border border-red-200 bg-red-50/30"><p class="text-xs text-red-600">총 발견된 오류</p><p id="kpiTotalErrors" class="text-2xl font-bold text-red-600 mt-1">0</p></div>
      <div class="bg-white p-4 rounded-xl border border-amber-200 bg-amber-50/30"><p class="text-xs text-amber-700">오류 응답자 수</p><p id="kpiErrorResp" class="text-2xl font-bold text-amber-600 mt-1">0</p></div>
      <div class="bg-white p-4 rounded-xl border border-emerald-200 bg-emerald-50/30"><p class="text-xs text-emerald-700">정상 응답률</p><p id="kpiCleanRate" class="text-2xl font-bold text-emerald-600 mt-1">0%</p></div>
    </section>

    <section id="resultSection" class="hidden bg-white border border-slate-200 rounded-xl overflow-hidden">
      <div class="border-b border-slate-200 px-6 flex items-center gap-6 bg-slate-50">
        <button id="tabBtnErrors" onclick="switchTab('errors')" class="py-3.5 text-sm font-bold border-b-2 border-blue-600 text-blue-600">오류 내역 (<span id="tabErrorCount">0</span>)</button>
        <button id="tabBtnLogic" onclick="switchTab('logic')" class="py-3.5 text-sm font-medium border-b-2 border-transparent text-slate-500">파싱된 로직 (<span id="tabLogicCount">0</span>)</button>
      </div>
      <div id="tabErrorsContent" class="p-6 space-y-4">
        <div class="flex flex-wrap gap-2">
          <select id="filterErrorType" onchange="renderErrorTable()" class="text-xs border border-slate-300 rounded-lg px-3 py-2">
            <option value="ALL">전체 오류 유형</option>
            <option value="MISSING">응답 누락 (Missing)</option>
            <option value="SKIP_ERROR">스킵 위반 (Skip Error)</option>
            <option value="OUT_OF_RANGE">범위 위반 (Out of Range)</option>
            <option value="RANK_MISMATCH">순위 불일치 (Rank Mismatch)</option>
            <option value="EXCLUSIVE_ERROR">배타성 중복 위반 (Exclusive Error)</option>
            <option value="COL_NOT_FOUND">컬럼 미매칭 (Not Found)</option>
          </select>
          <input type="text" id="filterSearch" oninput="renderErrorTable()" placeholder="검색..." class="text-xs border border-slate-300 rounded-lg px-3 py-2 w-72" />
        </div>
        <div class="overflow-x-auto border border-slate-200 rounded-lg max-h-[540px]">
          <table class="w-full text-left border-collapse text-xs">
            <thead class="bg-slate-100 text-slate-600 sticky top-0">
              <tr>
                <th class="py-2.5 px-3 border-b">ID</th><th class="py-2.5 px-3 border-b">문항</th><th class="py-2.5 px-3 border-b">컬럼</th><th class="py-2.5 px-3 border-b">오류 유형</th>
                <th class="py-2.5 px-3 border-b">Base 조건</th><th class="py-2.5 px-3 border-b">실제 입력값</th><th class="py-2.5 px-3 border-b">허용 기준</th><th class="py-2.5 px-3 border-b">참조 변수값</th>
              </tr>
            </thead>
            <tbody id="errorTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
      <div id="tabLogicContent" class="hidden p-6 space-y-4">
        <div class="overflow-x-auto border border-slate-200 rounded-lg max-h-[540px]">
          <table class="w-full text-left border-collapse text-xs">
            <thead class="bg-slate-100 text-slate-600 sticky top-0">
              <tr>
                <th class="py-2.5 px-3 border-b">단위 ID</th><th class="py-2.5 px-3 border-b">원본 문항</th><th class="py-2.5 px-3 border-b">유형</th><th class="py-2.5 px-3 border-b">Base 조건</th>
                <th class="py-2.5 px-3 border-b">유효 코드</th><th class="py-2.5 px-3 border-b">매칭된 컬럼</th><th class="py-2.5 px-3 border-b">설명</th>
              </tr>
            </thead>
            <tbody id="logicTableBody" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    let rawLogicRows = [], rawDataRows = [], rawDataHeaders = [], lowerHeaderMap = {};
    let parsedRules = [], validationErrors = [], variableValueCache = {};
    const RANK_SUFFIXES = [{ suffix: "fst", rank: 1 }, { suffix: "snd", rank: 2 }, { suffix: "trd", rank: 3 }, { suffix: "4th", rank: 4 }, { suffix: "5th", rank: 5 }];

    document.getElementById('logicFileInput').addEventListener('change', (e) => handleFile(e.target.files[0], 'logic'));
    document.getElementById('rawFileInput').addEventListener('change', (e) => handleFile(e.target.files[0], 'raw'));

    function handleFile(file, type) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        if (type === 'logic') {
          rawLogicRows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
          document.getElementById('logicFileName').textContent = `✅ ${file.name} 로드됨`;
          parseLogicRows(rawLogicRows);
        } else {
          rawDataRows = XLSX.utils.sheet_to_json(ws, { defval: "" });
          rawDataHeaders = rawDataRows.length ? Object.keys(rawDataRows[0]) : [];
          lowerHeaderMap = {};
          rawDataHeaders.forEach(h => { lowerHeaderMap[h.toLowerCase().trim()] = h; });
          document.getElementById('rawFileName').textContent = `✅ ${file.name} 로드됨`;
          const sel = document.getElementById('idColSelect');
          sel.innerHTML = '<option value="__ROW__">엑셀 행 번호</option>';
          rawDataHeaders.forEach(h => {
            const opt = document.createElement('option'); opt.value = h; opt.textContent = h; sel.appendChild(opt);
            if (/^(id|respid|uuid|iirepserial)$/i.test(h)) sel.value = h;
          });
        }
        if (rawLogicRows.length > 0 && rawDataRows.length > 0) document.getElementById('btnRunValidation').disabled = false;
      };
      reader.readAsArrayBuffer(file);
    }

    function parseLogicRows(rows) {
      parsedRules = [];
      let startIdx = 0;
      for (let i = 0; i < Math.min(rows.length, 15); i++) {
        if (String(rows[i][0]).toLowerCase().trim() === "variable name") { startIdx = i + 1; break; }
      }
      let currentBlock = null, blocks = [];
      for (let i = startIdx; i < rows.length; i++) {
        const colA = String(rows[i][0] ?? "").trim(), colB = String(rows[i][1] ?? "").trim(), colC = String(rows[i][2] ?? "").trim();
        if (!colA && !colB && !colC) continue;
        const isHeader = colA !== "" && colC !== "" && /single|multi|grid|rank|순위|open|numeric|slider/i.test(colC);
        if (isHeader) {
          if (currentBlock) blocks.push(currentBlock);
          currentBlock = { varName: colA, questionText: colB, qTypeRaw: colC, subRows: [] };
        } else if (currentBlock) currentBlock.subRows.push({ colA, colB, colC });
      }
      if (currentBlock) blocks.push(currentBlock);

      blocks.forEach(block => {
        const qLow = block.qTypeRaw.toLowerCase();
        // 개방형(Open) 속성은 별도의 변수로 들고 가고, MULTI와 겹쳐도 MULTI 속성을 우선 적용하도록 설계
        const isOpen = qLow.includes("open") || qLow.includes("numeric"); 
        const isGrid = qLow.includes("grid");
        const isMulti = qLow.includes("multi") || /\bma\b/.test(qLow);
        const isRanking = qLow.includes("rank") || qLow.includes("순위");

        if (isGrid) {
          let section = "NONE", gridBase = "All", gridItems = [], validCodes = [], exclusiveCodes = [];
          block.subRows.forEach(r => {
            const bLow = r.colB.toLowerCase().trim();
            if (r.colA === "" && bLow === "rows") { section = "ROWS"; if (r.colC) gridBase = r.colC.replace(/^base\s*:\s*/i, ""); return; }
            if (r.colA === "" && (bLow === "columns" || bLow === "cloumns")) { section = "COLS"; return; }
            if (section === "ROWS" && r.colA) gridItems.push({ code: r.colA, label: r.colB, base: r.colC ? r.colC.replace(/^base\s*:\s*/i, "") : "All" });
            else if (section === "COLS" && r.colA) {
              validCodes.push(r.colA);
              if (/없음|모름|해당\s*사항|않음|기억\s*안\s*남/i.test(r.colB)) exclusiveCodes.push(String(r.colA));
            }
          });
          gridItems.forEach((item, idx) => {
            const b1 = (!gridBase || gridBase.toLowerCase() === "all") ? null : gridBase;
            const b2 = (!item.base || item.base.toLowerCase() === "all") ? null : item.base;
            parsedRules.push({
              ruleId: `${block.varName}${item.code}`, parentVar: block.varName, rowCode: item.code, rowIndex: idx + 1,
              qType: isMulti ? "GRID_MULTI" : "GRID_SINGLE", qTypeRaw: block.qTypeRaw, baseExpr: (b1 && b2) ? `(${b1}) & (${b2})` : (b1 || b2 || "All"),
              isOpen: isOpen, validCodes: [...validCodes], exclusiveCodes: [...exclusiveCodes], label: `[${item.code}] ${item.label}`
            });
          });
        } else {
          let baseExpr = "All", validCodes = [], exclusiveCodes = [];
          block.subRows.forEach((r, idx) => {
            if (idx === 0 && r.colC && /^base\s*:/i.test(r.colC)) baseExpr = r.colC.replace(/^base\s*:\s*/i, "");
            if (r.colA) {
              validCodes.push(r.colA);
              if (/없음|모름|해당\s*사항|않음|기억\s*안\s*남/i.test(r.colB)) exclusiveCodes.push(String(r.colA));
            }
          });
          // Multiple answer(Open) 등 다중응답 속성을 먼저 판별하여 MULTI로 분류 (단, isOpen 속성은 들고 감)
          let detectedType = isRanking ? "RANKING" : (isMulti ? "MULTI" : (isOpen ? "OPEN" : "SINGLE"));
          parsedRules.push({ ruleId: block.varName, parentVar: block.varName, qType: detectedType, qTypeRaw: block.qTypeRaw, baseExpr: baseExpr || "All", isOpen: isOpen, validCodes, exclusiveCodes, label: block.questionText.replace(/\r?\n/g, " ") });
        }
      });
    }

    function bindColumnsToRule(rule) {
      const v = rule.parentVar.toLowerCase().trim();
      if (rule.qType === "GRID_SINGLE") {
        const rc = rule.rowCode.toLowerCase().trim();
        rule.matchedCols = lowerHeaderMap[`${v}${rc}`] ? [lowerHeaderMap[`${v}${rc}`]] : (lowerHeaderMap[`${v}_${rc}`] ? [lowerHeaderMap[`${v}_${rc}`]] : []);
        return;
      }
      if (rule.qType === "GRID_MULTI") {
        const rc = rule.rowCode.toLowerCase().trim(), pfx = [`${v}${rc}`, `${v}_${rc}`];
        let found = [];
        for (const p of pfx) {
          const rx = new RegExp(`^${p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}_(\\d+)$`, 'i');
          const mt = rawDataHeaders.filter(h => rx.test(h.trim()));
          if (mt.length) { found = mt; break; }
        }
        rule.matchedCols = found; return;
      }
      if (rule.qType === "RANKING") {
        const opts = [], rks = [];
        const rx = new RegExp(`^${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}_(\\d+)$`, 'i');
        rawDataHeaders.forEach(h => { const m = h.trim().match(rx); if (m) opts.push({ code: m[1], col: h }); });
        RANK_SUFFIXES.forEach(rs => { if (lowerHeaderMap[`${v}_${rs.suffix}`]) rks.push({ rank: rs.rank, suffix: rs.suffix, col: lowerHeaderMap[`${v}_${rs.suffix}`] }); });
        rule.rankingMeta = { optionCols: opts, rankOrderCols: rks };
        rule.matchedCols = [...opts.map(o => o.col), ...rks.map(r => r.col)];
        return;
      }
      if (rule.qType === "MULTI" || rule.qType === "OPEN") {
        const rx = new RegExp(`^${v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}_(\\d+)$`, 'i'), sub = [];
        rawDataHeaders.forEach(h => { if (rx.test(h.trim())) sub.push(h); });
        if (!sub.length && lowerHeaderMap[v]) sub.push(lowerHeaderMap[v]);
        rule.matchedCols = sub; return;
      }
      rule.matchedCols = lowerHeaderMap[v] ? [lowerHeaderMap[v]] : [];
    }

    function getRespVals(row, varName) {
      const v = varName.toLowerCase().trim();
      if (!variableValueCache[v]) {
        let vars = [v];
        const rm = v.match(/^([a-z0-9_]+)_?([a-z])-([a-z])$/i);
        if (rm) { vars = []; for (let i = rm[2].charCodeAt(0); i <= rm[3].charCodeAt(0); i++) { vars.push(`${rm[1]}${String.fromCharCode(i)}`); vars.push(`${rm[1]}_${String.fromCharCode(i)}`); } }
        let ex = [], rk = [], sub = [];
        vars.forEach(vc => {
          if (lowerHeaderMap[vc]) ex.push(lowerHeaderMap[vc]);
          RANK_SUFFIXES.forEach(rs => { if (lowerHeaderMap[`${vc}_${rs.suffix}`]) rk.push(lowerHeaderMap[`${vc}_${rs.suffix}`]); });
          const rx = new RegExp(`^${vc.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}_(\\d+)$`, 'i');
          rawDataHeaders.forEach(h => { const m = h.match(rx); if (m) sub.push({ code: m[1], col: h }); });
        });
        variableValueCache[v] = { ex, rk, sub };
      }
      const info = variableValueCache[v], sel = new Set();
      info.ex.forEach(c => { const val = String(row[c] ?? "").trim(); if (val) val.split(",").forEach(p => p.trim() && sel.add(p.trim())); });
      info.rk.forEach(c => { const val = String(row[c] ?? "").trim(); if (val && val !== "0") sel.add(val); });
      info.sub.forEach(c => { const val = String(row[c.col] ?? "").trim(); if (val && val !== "0") sel.add(c.code); });
      return Array.from(sel);
    }

    function evalBase(baseExpr, row) {
      if (!baseExpr || baseExpr.toLowerCase() === "all") return { passed: true, refSummary: "Base: All" };
      const refVars = new Set();
      const js = baseExpr.replace(/\bAND\b/gi, "&&").replace(/\bOR\b/gi, "||").replace(/&+/g, "&&").replace(/\|+/g, "||")
        .replace(/([a-zA-Z0-9_.\-]+)\s*(‡|≠|!=|<>|>=|<=|>|<|=)\s*([0-9,\-\sA-Za-z]+)/g, (m, v, op, rhs) => {
          refVars.add(v); const vals = getRespVals(row, v), tgts = [];
          rhs.split(",").forEach(p => { const r = p.trim().match(/^(\d+)\s*-\s*(\d+)$/); if (r) { for (let k = Number(r[1]); k <= Number(r[2]); k++) tgts.push(String(k)); } else if (p.trim()) tgts.push(p.trim()); });
          if (op === "=") return vals.some(x => tgts.includes(String(x))) ? "true" : "false";
          if (["≠", "!=", "<>", "‡"].includes(op)) return !vals.some(x => tgts.includes(String(x))) ? "true" : "false";
          const nt = Number(rhs.trim()), na = vals.length ? Number(vals[0]) : NaN;
          if (isNaN(na)) return "false";
          if (op === ">=") return na >= nt ? "true" : "false"; if (op === "<=") return na <= nt ? "true" : "false";
          if (op === ">") return na > nt ? "true" : "false"; if (op === "<") return na < nt ? "true" : "false";
          return "true";
        });
      let passed = true; try { passed = Boolean(Function(`"use strict"; return (${js});`)()); } catch(e){}
      return { passed, refSummary: Array.from(refVars).map(v => `${v}=[${getRespVals(row, v).join(",") || "빈값"}]`).join(", ") };
    }

    function runValidation() {
      validationErrors = []; variableValueCache = {};
      const idCol = document.getElementById('idColSelect').value;
      parsedRules.forEach(r => bindColumnsToRule(r));
      const errSet = new Set();

      parsedRules.forEach(rule => {
        if (!rule.matchedCols || rule.matchedCols.length === 0) {
          validationErrors.push({ respId: "전체(오류)", ruleId: rule.ruleId, rawCol: "미매칭", errorType: "COL_NOT_FOUND", baseExpr: rule.baseExpr, actualVal: "-", validCodes: rule.validCodes.join(","), refSummary: "컬럼을 찾을 수 없음" });
        }
      });

      rawDataRows.forEach((row, rIdx) => {
        const respId = idCol === "__ROW__" ? `Row #${rIdx + 2}` : String(row[idCol] ?? `Row #${rIdx + 2}`);
        parsedRules.forEach(rule => {
          if (!rule.matchedCols || !rule.matchedCols.length) return;
          const { passed: isBase, refSummary } = evalBase(rule.baseExpr, row);

          if (rule.qType === "SINGLE" || rule.qType === "GRID_SINGLE" || rule.qType === "OPEN") {
            const col = rule.matchedCols[0], val = String(row[col] ?? "").trim();
            if (isBase) {
              if (val === "") { validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: col, errorType: "MISSING", baseExpr: rule.baseExpr, actualVal: "(빈값)", validCodes: rule.validCodes.join(","), refSummary }); errSet.add(respId); }
              else if (rule.qType !== "OPEN" && !rule.isOpen && rule.validCodes.length && !rule.validCodes.includes(val)) { validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: col, errorType: "OUT_OF_RANGE", baseExpr: rule.baseExpr, actualVal: val, validCodes: rule.validCodes.join(","), refSummary }); errSet.add(respId); }
            } else if (val !== "") { validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: col, errorType: "SKIP_ERROR", baseExpr: rule.baseExpr, actualVal: val, validCodes: "빈값이어야 함 (Skip)", refSummary }); errSet.add(respId); }
          } else if (rule.qType === "MULTI" || rule.qType === "GRID_MULTI") {
            let sel = [], inv = [];
            rule.matchedCols.forEach(c => {
              const val = String(row[c] ?? "").trim(); if (!val || val === "0") return;
              const sf = c.trim().match(/_(\d+)$/);
              if (sf) { 
                // isOpen(텍스트 허용)이면 값 자체가 무엇이든 에러가 아님
                if (val === "1" || val === sf[1] || rule.isOpen) sel.push(sf[1]); 
                else inv.push(`${c}=${val}`); 
              } else {
                sel.push(val);
              }
            });
            const colLbl = rule.matchedCols.length > 3 ? `${rule.matchedCols[0]} ~ ${rule.matchedCols[rule.matchedCols.length - 1]} (${rule.matchedCols.length}개)` : rule.matchedCols.join(", ");
            
            if (isBase) {
              if (!sel.length && !inv.length) { 
                validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: colLbl, errorType: "MISSING", baseExpr: rule.baseExpr, actualVal: "(선택 없음)", validCodes: rule.validCodes.join(","), refSummary }); errSet.add(respId); 
              } else if (inv.length && !rule.isOpen) { 
                validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: colLbl, errorType: "OUT_OF_RANGE", baseExpr: rule.baseExpr, actualVal: inv.join(", "), validCodes: "0, 1 (또는 허용 코드)", refSummary }); errSet.add(respId); 
              } else if (sel.length > 1 && rule.exclusiveCodes && rule.exclusiveCodes.some(x => sel.includes(x))) {
                const conflicts = sel.filter(x => rule.exclusiveCodes.includes(x));
                validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: colLbl, errorType: "EXCLUSIVE_ERROR", baseExpr: rule.baseExpr, actualVal: `선택됨: ${sel.join(", ")}`, validCodes: `'${conflicts.join(", ")}' 코드는 단독으로만 선택해야 함`, refSummary }); errSet.add(respId);
              }
            } else if (sel.length || inv.length) { 
              validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: colLbl, errorType: "SKIP_ERROR", baseExpr: rule.baseExpr, actualVal: sel.length ? sel.join(", ") : inv.join(", "), validCodes: "모두 빈값이어야 함", refSummary }); errSet.add(respId); 
            }
          } else if (rule.qType === "RANKING") {
            validateRankingRule(rule, row, respId, isBase, refSummary, errSet);
          }
        });
      });
      const tot = rawDataRows.length;
      document.getElementById('kpiTotalResp').textContent = tot; document.getElementById('kpiTotalVars').textContent = parsedRules.length;
      document.getElementById('kpiTotalErrors').textContent = validationErrors.length; document.getElementById('kpiErrorResp').textContent = errSet.size;
      document.getElementById('kpiCleanRate').textContent = tot ? (((tot - errSet.size) / tot) * 100).toFixed(1) + '%' : '0%';
      document.getElementById('tabErrorCount').textContent = validationErrors.length; document.getElementById('tabLogicCount').textContent = parsedRules.length;
      document.getElementById('kpiSection').classList.remove('hidden'); document.getElementById('resultSection').classList.remove('hidden');
      document.getElementById('btnDownloadReport').classList.remove('hidden');
      renderErrorTable(); renderLogicTable();
    }

    function validateRankingRule(rule, row, respId, isBaseMet, refSummary, errorRespSet) {
      const { optionCols, rankOrderCols } = rule.rankingMeta;
      const colLabel = formatColSummary(rule.matchedCols);

      const optMap = {}; 
      optionCols.forEach(o => { const val = String(row[o.col] ?? "").trim(); if (val && val !== "0") optMap[o.code] = val; });
      const ords = []; 
      rankOrderCols.forEach(r => { const val = String(row[r.col] ?? "").trim(); ords.push({ ...r, val }); });
      
      const filled = ords.filter(e => e.val && e.val !== "0");
      const optionRankCount = Object.keys(optMap).length;

      if (!isBaseMet) {
        if (optionRankCount > 0 || filled.length > 0) {
          const actualSummary = [...filled.map(e => `${e.col}=${e.val}`), ...Object.entries(optMap).map(([c, r]) => `${rule.parentVar}_${c}=${r}`)].join(", ");
          validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: colLabel, errorType: "SKIP_ERROR", baseExpr: rule.baseExpr, actualVal: actualSummary, validCodes: "빈값이어야 함 (Skip)", refSummary });
          errorRespSet.add(respId);
        }
        return;
      }
      if (optionRankCount === 0 && filled.length === 0) {
        validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: colLabel, errorType: "MISSING", baseExpr: rule.baseExpr, actualVal: "(순위 응답 없음)", validCodes: formatValidSpec(rule), refSummary });
        errorRespSet.add(respId);
        return;
      }
      if (rule.validCodes.length > 0) {
        filled.forEach(e => {
          if (!rule.validCodes.includes(e.val)) {
            validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: e.col, errorType: "OUT_OF_RANGE", baseExpr: rule.baseExpr, actualVal: `${e.col}=${e.val}`, validCodes: formatValidSpec(rule), refSummary });
            errorRespSet.add(respId);
          }
        });
      }

      const mm = [], seen = new Set();
      filled.forEach(e => { if (seen.has(e.val)) mm.push(`순위 중복(${e.col}=${e.val})`); seen.add(e.val); });
      for (let i = 0; i < ords.length; i++) {
        const currEmpty = !ords[i].val || ords[i].val === "0";
        const laterFilled = ords.slice(i + 1).some(x => x.val && x.val !== "0");
        if (currEmpty && laterFilled) mm.push(`${ords[i].col} 누락`);
      }
      if (optionCols.length && rankOrderCols.length) {
        if (optionRankCount !== filled.length) mm.push(`선택 개수 불일치 (보기컬럼 ${optionRankCount}개 선택 vs 순위컬럼 ${filled.length}개 랭크됨)`);
        filled.forEach(e => { if (!optMap[e.val]) mm.push(`세트 불일치 (${e.col}=${e.val} 입력됨, 그러나 보기컬럼 ${rule.parentVar}_${e.val} 비어있음)`); });
      }
      if (mm.length > 0) {
        validationErrors.push({ respId, ruleId: rule.ruleId, rawCol: colLabel, errorType: "RANK_MISMATCH", baseExpr: rule.baseExpr, actualVal: mm.join(" / "), validCodes: "보기 선택 세트와 순위 세트가 일치해야 함", refSummary });
        errorRespSet.add(respId);
      }
    }

    function formatColSummary(cols) {
      if (!cols || !cols.length) return "미매칭";
      if (cols.length <= 3) return cols.join(", ");
      return `${cols[0]} ~ ${cols[cols.length - 1]} (${cols.length}개)`;
    }

    function formatValidSpec(rule) {
      if (rule.numericRange) return `${rule.validCodes.join(", ")} (또는 ${rule.numericRange.min}~${rule.numericRange.max})`;
      if (rule.validCodes.length > 6) return `${rule.validCodes[0]} ~ ${rule.validCodes[rule.validCodes.length - 1]} (총 ${rule.validCodes.length}개)`;
      return rule.validCodes.join(", ") || "자유응답";
    }

    function renderErrorTable() {
      const type = document.getElementById('filterErrorType').value, search = document.getElementById('filterSearch').value.toLowerCase().trim();
      const flt = validationErrors.filter(e => (type === "ALL" || e.errorType === type) && (!search || e.ruleId.toLowerCase().includes(search) || e.respId.toLowerCase().includes(search) || e.rawCol.toLowerCase().includes(search)));
      const styles = { MISSING: "bg-red-100 text-red-700", SKIP_ERROR: "bg-amber-100 text-amber-800", OUT_OF_RANGE: "bg-purple-100 text-purple-700", RANK_MISMATCH: "bg-pink-100 text-pink-700", EXCLUSIVE_ERROR: "bg-orange-100 text-orange-800", COL_NOT_FOUND: "bg-slate-200 text-slate-700" };
      document.getElementById('errorTableBody').innerHTML = flt.slice(0, 1000).map(e => `<tr class="hover:bg-slate-50"><td class="py-2 px-3 font-semibold">${e.respId}</td><td class="py-2 px-3 font-mono font-bold text-blue-600">${e.ruleId}</td><td class="py-2 px-3 font-mono text-slate-600">${e.rawCol}</td><td class="py-2 px-3"><span class="px-2 py-0.5 rounded text-[11px] font-semibold ${styles[e.errorType] || ''}">${e.errorType}</span></td><td class="py-2 px-3 font-mono text-slate-700">${e.baseExpr}</td><td class="py-2 px-3 font-mono font-bold text-red-600">${e.actualVal}</td><td class="py-2 px-3 text-slate-600">${e.validCodes}</td><td class="py-2 px-3 font-mono text-slate-500">${e.refSummary}</td></tr>`).join("") || `<tr><td colspan="8" class="py-10 text-center text-slate-400">오류가 없습니다.</td></tr>`;
    }

    function renderLogicTable() {
      document.getElementById('logicTableBody').innerHTML = parsedRules.map(r => {
        const m = r.matchedCols && r.matchedCols.length;
        return `<tr class="hover:bg-slate-50"><td class="py-2 px-3 font-mono font-bold text-blue-600">${r.ruleId}</td><td class="py-2 px-3 font-mono text-slate-600">${r.parentVar}</td><td class="py-2 px-3"><span class="px-2 py-0.5 rounded bg-slate-100 text-[11px]">${r.qType}</span></td><td class="py-2 px-3 font-mono text-emerald-700 font-medium">${r.baseExpr}</td><td class="py-2 px-3 text-slate-600">${r.validCodes.join(",") || "자유응답"}</td><td class="py-2 px-3 font-mono ${m ? 'text-slate-800' : 'text-red-600 font-bold'}">${m ? r.matchedCols.length > 3 ? `${r.matchedCols[0]} ~ ${r.matchedCols[r.matchedCols.length-1]} (${r.matchedCols.length}개)` : r.matchedCols.join(", ") : '미매칭'}</td><td class="py-2 px-3 text-slate-500 truncate max-w-xs">${r.label}</td></tr>`;
      }).join("");
    }

    function switchTab(t) {
      const e = t === 'errors';
      document.getElementById('tabErrorsContent').classList.toggle('hidden', !e); document.getElementById('tabLogicContent').classList.toggle('hidden', e);
      document.getElementById('tabBtnErrors').className = e ? "py-3.5 text-sm font-bold border-b-2 border-blue-600 text-blue-600" : "py-3.5 text-sm font-medium border-b-2 border-transparent text-slate-500";
      document.getElementById('tabBtnLogic').className = !e ? "py-3.5 text-sm font-bold border-b-2 border-blue-600 text-blue-600" : "py-3.5 text-sm font-medium border-b-2 border-transparent text-slate-500";
    }

    function exportErrorReport() {
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(validationErrors.map(e => ({ "응답자 ID": e.respId, "검증 문항(Rule ID)": e.ruleId, "컬럼": e.rawCol, "오류 유형": e.errorType, "Base": e.baseExpr, "입력값": e.actualVal, "허용 기준": e.validCodes, "참조 변수값": e.refSummary }))), "오류_상세_내역");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(parsedRules.map(r => ({ "ID": r.ruleId, "원본": r.parentVar, "유형": r.qType, "Base": r.baseExpr, "코드": r.validCodes.join(","), "매칭": r.matchedCols ? r.matchedCols.join(",") : "미매칭", "설명": r.label }))), "파싱_규칙");
      XLSX.writeFile(wb, `Logic_Report_${new Date().toISOString().slice(0,10)}.xlsx`);
    }
  </script>
